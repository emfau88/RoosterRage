<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rooster Rage · Stärkere Auren · Entwurf 2</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#17201e;color:#f5f0df;font-family:Arial,sans-serif}main{width:min(1120px,100%);margin:auto}
    header{height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #35443c}
    .eyebrow{font-size:11px;letter-spacing:2px;color:#a9b8a5;margin-bottom:8px}h1{font-size:23px;font-weight:600;margin:0}.badge{font-size:12px;padding:8px 12px;border:1px solid #53634e;border-radius:20px;color:#cbd9c2}
    nav{display:flex;justify-content:center;gap:12px;padding:12px}nav a,button{font:inherit;font-size:13px;color:#ecf2e4;background:#283a2d;border:1px solid #53674d;border-radius:7px;padding:8px 14px;text-decoration:none;cursor:pointer}nav a[aria-current]{background:#425640}
    #stage{position:relative;width:100%;overflow:hidden}#stage canvas{display:block;width:100%!important;height:auto!important}
    .row-labels{position:absolute;left:0;width:100%;height:6.363636%;display:grid;grid-template-columns:1fr 1fr;align-items:center;text-align:center;pointer-events:none}
    .row-labels strong{display:block;font-size:14px;font-weight:600;letter-spacing:.5px}.row-labels span{display:block;font-size:12px;color:#b8c3af;margin-top:6px}
    footer{height:50px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#b7c2ae}.phase{color:#e4ecd9}.capture nav,.capture button{display:none}
    @media(max-width:650px){header{height:80px;padding:0 16px}h1{font-size:18px}.badge{display:none}nav{gap:6px}nav a{padding:8px;font-size:12px}.row-labels strong{font-size:11px}.row-labels span{display:none}footer{padding:0 16px}.technical{display:none}}
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">ROOSTER RAGE · MEHR PRÄSENZ</div><h1 id="title">Stärkere Auren</h1></div><span class="badge">Entwurf 2 · noch nicht eingebaut</span></header>
  <nav aria-label="Aura-Gruppe"><a href="?group=healing" data-group="healing">Heilung & Regeneration</a><a href="?group=defense" data-group="defense">Wind & Rüstung</a><a href="?group=royal" data-group="royal">Explosion & Boss</a></nav>
  <div id="stage" aria-label="Zwei animierte Vergleiche, jeweils links der vorherige Entwurf und rechts der verstärkte Entwurf"></div>
  <footer><span class="phase" id="phase">Im Stand</span><span class="technical">Links: letzter Entwurf · rechts: verstärkt · identischer Figurenmaßstab</span><button id="pause" type="button">Pause</button></footer>
</main>
<script type="module" src="./study.js"></script>
</body>
</html>
