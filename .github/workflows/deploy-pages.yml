name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify optimized assets
        run: npm run assets:check

      - name: Production build and gate
        run: npm run test:production

      - name: Smoke test
        run: npm run test:smoke

      - name: Mechanics test
        run: npm run test:mechanics

      - name: Build GitHub Pages artifact
        run: npm run build -- --base=/RoosterRage/

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rooster-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
