name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - codex/kongregate-upload
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name == 'master' && github.sha || 'master' }}

      - name: Record shared build revision
        id: build-revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify optimized assets
        run: npm run assets:check

      - name: Production build and gate
        run: npm run test:production

      - name: Smoke test
        run: npm run test:smoke

      - name: Mechanics test
        run: npm run test:mechanics

      - name: Privacy-safe product analytics test
        run: npm run test:product

      - name: Build and verify GitHub Pages artifact
        run: npm run test:pages

      - name: Checkout Kongregate candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.build-revision.outputs.commit }}
          path: kongregate-source

      - name: Install Kongregate candidate dependencies
        working-directory: kongregate-source
        run: npm ci

      - name: Build and verify Kongregate candidate
        working-directory: kongregate-source
        run: npm run test:release

      - name: Verify Kongregate preview URL
        working-directory: kongregate-source
        run: node tests/release-gate.mjs dist-release /RoosterRage/kongregate/

      - name: Add Kongregate preview to GitHub Pages
        run: |
          cp -R kongregate-source/dist-release dist-pages/kongregate
          node --input-type=module -e "import { execFileSync } from 'node:child_process'; import { writeFileSync } from 'node:fs'; const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); const candidate = execFileSync('git', ['-C', 'kongregate-source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (candidate !== commit) throw new Error('Pages and Kongregate revisions differ'); const info = JSON.stringify({ branch: 'master', commit }, null, 2) + '\n'; writeFileSync('dist-pages/build-info.json', info); writeFileSync('dist-pages/kongregate/build-info.json', info);"

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rooster-test-results
          path: |
            test-results
            kongregate-source/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
